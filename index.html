<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Database Lookup</title>
    <link rel="stylesheet" href="world.css">
</head>
<body>
    <header>
        <img src="images/worldmap.jpg" alt="World Map" class="logo">
        <h1>World Database Lookup</h1>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="country" placeholder="Enter country name">
            <button id="lookup">Lookup Country</button>
            <button id="lookup-cities">Lookup Cities</button>
        </div>
        <div id="result"></div>
    </main>

    <script src="world.js"></script>
</body>
</html>
